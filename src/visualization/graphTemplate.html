<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="${cytoscapeUri}"></script>
    <script src="${elkjsUri}"></script>
    <script src="${cytoscapeElkUri}"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: var(--vscode-editor-background);
        color: var(--vscode-editor-foreground);
      }
      #cy {
        width: 100vw;
        height: 100vh;
        display: block;
      }
    </style>
  </head>
  <body
    data-cytoscape-debug="__CYTOSCAPE_DEBUG__"
    data-node-plus-uri="__NODE_PLUS_URI__"
    data-node-minus-uri="__NODE_MINUS_URI__"
  >
    <div id="cy"></div>
    <script type="module" src="${scriptUri}"></script>
  </body>
</html>
