<!doctype html>
<html lang="en">
  <head>
    <!-- Webview shell that hosts the Pixi canvas and runtime module entrypoint. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: var(--vscode-editor-background);
        color: var(--vscode-editor-foreground);
        width: 100%;
        height: 100%;
      }

      #pixi-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="pixi-canvas"></canvas>
    <script type="importmap">
      {
        "imports": {
          "pixi.js": "${pixiImportUrl}",
          "pixi-viewport": "${pixiViewportImportUrl}"
        }
      }
    </script>
    <script type="module" src="${scriptUri}"></script>
  </body>
</html>
